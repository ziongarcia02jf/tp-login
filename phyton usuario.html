<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Login simple</title>
<style>
  body {
    max-width: 900px;
    margin: 40px auto;
    padding: 0 16px;
    font-family: Arial, sans-serif;
    text-align: center;
  }

  #contenedor {
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    align-items: flex-start;
    justify-content: center;
    text-align: left;
  }

  #principal {
    flex: 1;
    min-width: 280px;
    text-align: center;
  }

  #ayuda {
    width: 300px;
    text-align: left;
    border-left: 1px solid #ccc;
    padding-left: 20px;
    font-size: 14px;
  }
</style>
</head>
<body>

<div id="contenedor">
<div id="principal">

<!-- ===== PANTALLA 1: USUARIO Y CONTRASEÑA ===== -->
<div id="pantallaLogin">
  <h2>Iniciar sesión</h2>
  Usuario: <input id="usuario"><br><br>
  Contraseña: <input id="clave" type="password"><br><br>
  <button onclick="entrar()">Ingresar</button>
  <p id="mensaje"></p>
</div>

<!-- ===== PANTALLA 2: PREGUNTAS DE SEGURIDAD ===== -->
<div id="pantallaPreguntas" hidden>
  <h2>Preguntas de seguridad</h2>
  <p id="quien"></p>
  <p>1. ¿Nombre de tu primera mascota?<br><input id="r1"></p>
  <p>2. ¿Ciudad donde naciste?<br><input id="r2"></p>
  <p>3. ¿Nombre de tu escuela primaria?<br><input id="r3"></p>
  <button onclick="verificar()">Verificar e ingresar</button>
  <p id="mensaje2"></p>
</div>

<!-- ===== PANTALLA 3: PANEL DEL USUARIO ===== -->
<div id="pantallaPanel" hidden>
  <h2 id="tituloPanel"></h2>
  <p id="datos"></p>

  <div id="zonaAdmin" hidden>
    <hr>
    <h3>Lista de usuarios</h3>
    <div id="lista"></div>

    <hr>
    <h3>Agregar usuario</h3>
    Nombre: <input id="nuevoNombre"><br><br>
    Usuario: <input id="nuevoUsuario"><br><br>
    Contraseña: <input id="nuevoClave"><br><br>
    Rol: <select id="nuevoRol">
      <option value="comun">Común</option>
      <option value="admin">Administrador</option>
    </select><br><br>
    Respuesta 1: <input id="nuevoR1"><br><br>
    Respuesta 2: <input id="nuevoR2"><br><br>
    Respuesta 3: <input id="nuevoR3"><br><br>
    <button onclick="agregar()">Agregar</button>
    <p id="mensaje3"></p>
  </div>

  <hr>
  <button onclick="salir()">Cerrar sesión</button>
</div>

</div><!-- /principal -->

<!-- ===== AYUDA: USUARIOS Y CONTRASEÑAS ===== -->
<div id="ayuda">
  <h3>Usuarios del sistema</h3>
  <div id="tablaUsuarios"></div>
</div>

</div><!-- /contenedor -->

<script>
// ============================================================
//  LOGIN SIMPLE - Demo escolar
//  Los usuarios se guardan en el navegador (localStorage).
//  Cuentas de ejemplo:
//    admin   / admin123   -> firulais / buenos aires / san martin
//    usuario / usuario123 -> luna / cordoba / belgrano
// ============================================================

// 1. Leer los usuarios guardados en el navegador.
var usuarios = JSON.parse(localStorage.getItem("usuariosLogin"));

// 2. Si no hay ninguno, crear las dos cuentas de ejemplo.
if (usuarios === null) {
  usuarios = [
    {
      nombre: "Administrador",
      usuario: "admin",
      clave: "admin123",
      rol: "admin",
      respuestas: ["firulais", "buenos aires", "san martin"]
    },
    {
      nombre: "Usuario común",
      usuario: "usuario",
      clave: "usuario123",
      rol: "comun",
      respuestas: ["luna", "cordoba", "belgrano"]
    }
  ];
  guardar();
}

var pendiente = null; // usuario que ya escribió bien la contraseña

dibujarAyuda();

// ============================================================
//  FUNCIONES DE APOYO
// ============================================================

// Guarda la lista en el navegador y actualiza el panel de la derecha.
function guardar() {
  localStorage.setItem("usuariosLogin", JSON.stringify(usuarios));
  dibujarAyuda();
}

// Devuelve el nombre lindo del rol.
function nombreRol(rol) {
  if (rol === "admin") {
    return "Administrador";
  }
  return "Común";
}

// Pasa el texto a minúsculas, sin acentos y sin espacios en los bordes.
function normalizar(texto) {
  var cambios = {
    "á": "a", "é": "e", "í": "i", "ó": "o", "ú": "u",
    "ü": "u", "ñ": "n"
  };

  texto = texto.toLowerCase().trim();
  var salida = "";

  for (var i = 0; i < texto.length; i++) {
    var letra = texto[i];

    if (cambios[letra]) {
      salida = salida + cambios[letra];
    } else {
      salida = salida + letra;
    }
  }

  return salida;
}

// Muestra todos los usuarios en el panel de la derecha.
function dibujarAyuda() {
  var texto = "";

  for (var i = 0; i < usuarios.length; i++) {
    var u = usuarios[i];

    texto = texto + "<p><b>" + u.usuario + " (" + nombreRol(u.rol) + ")</b><br>";
    texto = texto + "Clave: " + u.clave + "<br>";
    texto = texto + "Respuestas: " + u.respuestas.join(" / ") + "</p>";
  }

  document.getElementById("tablaUsuarios").innerHTML = texto;
}

// ============================================================
//  LOGIN
// ============================================================

// Paso 1: revisa usuario y contraseña.
function entrar() {
  var nombre = document.getElementById("usuario").value.trim();
  var clave = document.getElementById("clave").value;
  var encontrado = null;

  for (var i = 0; i < usuarios.length; i++) {
    if (usuarios[i].usuario === nombre) {
      encontrado = usuarios[i];
    }
  }

  if (encontrado === null || encontrado.clave !== clave) {
    document.getElementById("mensaje").textContent = "Usuario o contraseña incorrectos.";
    return;
  }

  pendiente = encontrado;
  document.getElementById("mensaje").textContent = "";
  document.getElementById("quien").textContent = "Usuario: " + encontrado.usuario;
  document.getElementById("pantallaLogin").hidden = true;
  document.getElementById("pantallaPreguntas").hidden = false;
}

// Paso 2: revisa las 3 respuestas.
function verificar() {
  var r1 = normalizar(document.getElementById("r1").value);
  var r2 = normalizar(document.getElementById("r2").value);
  var r3 = normalizar(document.getElementById("r3").value);

  if (r1 !== normalizar(pendiente.respuestas[0]) ||
      r2 !== normalizar(pendiente.respuestas[1]) ||
      r3 !== normalizar(pendiente.respuestas[2])) {
    document.getElementById("mensaje2").textContent = "Alguna respuesta es incorrecta.";
    return;
  }

  document.getElementById("r1").value = "";
  document.getElementById("r2").value = "";
  document.getElementById("r3").value = "";
  document.getElementById("mensaje2").textContent = "";
  document.getElementById("pantallaPreguntas").hidden = true;
  document.getElementById("pantallaPanel").hidden = false;

  document.getElementById("tituloPanel").textContent = "Hola, " + pendiente.nombre;
  document.getElementById("datos").textContent =
    "Usuario: " + pendiente.usuario + " | Rol: " + nombreRol(pendiente.rol);

  if (pendiente.rol === "admin") {
    document.getElementById("zonaAdmin").hidden = false;
    dibujarLista();
  } else {
    document.getElementById("zonaAdmin").hidden = true;
  }
}

// ============================================================
//  ADMINISTRACIÓN DE USUARIOS
// ============================================================

// Muestra la lista con un botón "Eliminar" al lado de cada usuario.
function dibujarLista() {
  var texto = "";

  for (var i = 0; i < usuarios.length; i++) {
    var u = usuarios[i];

    texto = texto + "<p>" + u.usuario + " (" + nombreRol(u.rol) + ") ";

    if (u.usuario !== pendiente.usuario) {
      texto = texto + '<button onclick="eliminar(' + i + ')">Eliminar</button>';
    }

    texto = texto + "</p>";
  }

  document.getElementById("lista").innerHTML = texto;
}

// Agrega un usuario nuevo.
function agregar() {
  var nombre = document.getElementById("nuevoNombre").value.trim();
  var usuario = document.getElementById("nuevoUsuario").value.trim();
  var clave = document.getElementById("nuevoClave").value;
  var rol = document.getElementById("nuevoRol").value;
  var r1 = document.getElementById("nuevoR1").value.trim();
  var r2 = document.getElementById("nuevoR2").value.trim();
  var r3 = document.getElementById("nuevoR3").value.trim();
  var mensaje = document.getElementById("mensaje3");

  if (nombre === "" || usuario === "" || clave === "" ||
      r1 === "" || r2 === "" || r3 === "") {
    mensaje.textContent = "Completá todos los campos.";
    return;
  }

  var existe = false;

  for (var i = 0; i < usuarios.length; i++) {
    if (usuarios[i].usuario === usuario) {
      existe = true;
    }
  }

  if (existe) {
    mensaje.textContent = "Ese usuario ya existe.";
    return;
  }

  usuarios.push({
    nombre: nombre,
    usuario: usuario,
    clave: clave,
    rol: rol,
    respuestas: [r1, r2, r3]
  });

  guardar();
  dibujarLista();

  document.getElementById("nuevoNombre").value = "";
  document.getElementById("nuevoUsuario").value = "";
  document.getElementById("nuevoClave").value = "";
  document.getElementById("nuevoR1").value = "";
  document.getElementById("nuevoR2").value = "";
  document.getElementById("nuevoR3").value = "";
  mensaje.textContent = "Usuario agregado.";
}

// Elimina el usuario que está en esa posición de la lista.
function eliminar(posicion) {
  var u = usuarios[posicion];
  var admins = 0;

  for (var i = 0; i < usuarios.length; i++) {
    if (usuarios[i].rol === "admin") {
      admins = admins + 1;
    }
  }

  if (u.rol === "admin" && admins === 1) {
    document.getElementById("mensaje3").textContent =
      "No se puede eliminar al último administrador.";
    return;
  }

  usuarios.splice(posicion, 1);
  guardar();
  dibujarLista();
  document.getElementById("mensaje3").textContent = "Usuario eliminado.";
}

// Vuelve a la pantalla de login.
function salir() {
  pendiente = null;
  document.getElementById("usuario").value = "";
  document.getElementById("clave").value = "";
  document.getElementById("mensaje").textContent = "";
  document.getElementById("pantallaPanel").hidden = true;
  document.getElementById("pantallaLogin").hidden = false;
}
</script>

</body>
</html>
